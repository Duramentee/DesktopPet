# 持续集成：前端与 Rust 两侧各跑一遍自动化检查。
#
# 目的有两个：一是防止逻辑回归（前端一百六十多个用例），
# 二是让 Linux 与 Windows 的 Rust 代码每次提交都真的编译一次——
# 需求文档承诺了三平台，但本地只有 Windows 一台机器。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 · 类型检查与单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 前端构建
        run: npm run build

      - name: 记录产物体积
        run: |
          du -sh dist
          du -sh dist/skins

  rust:
    name: Rust · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 侧的图形依赖
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 格式检查
        run: cargo fmt --check

      - name: 静态检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --locked

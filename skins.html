<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>皮肤管理</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
        background: #f6f6f7;
        color: #1f1f22;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      #status {
        font-size: 12px;
        color: #6b6b73;
      }

      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 10px;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 8px;
        border: 1px solid #dcdce0;
        border-radius: 10px;
        background: #ffffff;
        cursor: pointer;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      .card:hover {
        border-color: #9aa0aa;
      }

      .card.active {
        border-color: #2f6feb;
        box-shadow: 0 0 0 1px #2f6feb inset;
      }

      .card img {
        width: 64px;
        height: 64px;
        image-rendering: auto;
      }

      .card span {
        font-size: 12px;
        text-align: center;
        word-break: break-all;
      }

      .card .meta {
        font-size: 11px;
        color: #7a7a84;
        text-align: center;
        line-height: 1.3;
      }

      .empty {
        font-size: 12px;
        color: #6b6b73;
        grid-column: 1 / -1;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1b1f;
          color: #ececf1;
        }

        .card {
          background: #232329;
          border-color: #35353d;
        }

        .card:hover {
          border-color: #5a5a66;
        }

          .card .meta {
            color: #9a9aa4;
          }

        #status,
        .empty {
          color: #a0a0ab;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>皮肤管理</h1>
      <span id="status"></span>
    </header>
    <div id="gallery"></div>
    <script type="module" src="/src/skins.ts"></script>
  </body>
</html>
